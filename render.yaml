services:
  - type: web
    name: spicecrowd-web
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npx prisma db push --skip-generate && npm run start
    autoDeployTrigger: checksPass
    healthCheckPath: /
    domains:
      - www.spicecrowd.in
      - spicecrowd.shop
      - www.spicecrowd.shop
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        value: file:./dev.db
      - key: NEXT_PUBLIC_SITE_URL
        value: https://www.spicecrowd.shop
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false